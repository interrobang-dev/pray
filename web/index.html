<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pray</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // 첫 화면부터 테마·팔레트·강조색·글자 크기·대화 모양으로 (React·CSS 전에). theme.ts 가 미리 계산해 둔 pray.appearanceBoot 를 그대로 건다.
      // pray.* 가 없으면 이름을 바꾸기 전 키 jk-corp.* 를 읽는다 (main.tsx 가 옛 키를 새 키로 복사하기 전의 첫 화면 — src/legacyStorage.ts)
      // 규칙은 src/theme.ts·src/appearance.ts 와 같다 — 바꾸면 같이 바꾼다 (appearance.test.ts 가 이 스크립트를 돌려 결과를 맞춰 본다)
      ;(function () {
        var root = document.documentElement
        var choice = 'system'
        var boot = null
        try {
          choice = localStorage.getItem('pray.theme') || localStorage.getItem('jk-corp.theme') || 'system'
          boot = JSON.parse(localStorage.getItem('pray.appearanceBoot') || localStorage.getItem('jk-corp.appearanceBoot') || 'null')
        } catch (e) {}
        var theme = choice === 'dark' || (choice !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'
        root.dataset.theme = theme
        root.style.colorScheme = theme
        root.dataset.palette = (boot && boot.palette) || 'default'
        root.dataset.fontSize = (boot && boot.fontSize) || 'normal'
        var chat = (boot && boot.chat) || {}
        for (var key in chat) root.setAttribute('data-chat-' + key, chat[key])
        var vars = (boot && boot[theme]) || {}
        for (var name in vars) root.style.setProperty('--' + name, vars[name])
      })()
    </script>
    <!-- 앱 제목 글꼴 Fraunces 는 public/fonts/fraunces/ 에서 직접 준다 (@font-face 는 src/fonts.css). 첫 화면 제목용 정체 latin 만 미리 받는다 -->
    <link rel="preload" href="/fonts/fraunces/fraunces-normal-500-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
